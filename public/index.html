<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uçuş Logbook - Giriş & Kayıt</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .tab-menu {
            display: flex;
            background: #f1f2f6;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #2a5298;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button.submit-btn {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button.submit-btn:hover {
            background: #1e3c72;
        }
        .form-box {
            display: none;
        }
        .form-box.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>✈️ Uçuş Logbook</h2>
    
    <div class="tab-menu">
        <button type="button" id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
        <button type="button" id="tabRegister" class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <div id="loginFormBox" class="form-box active">
        <form action="/login" method="POST">
            <div class="form-group">
                <label>E-Posta Adresi</label>
                <input type="email" name="email" required placeholder="ornek@eposta.com">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Giriş Yap</button>
        </form>
    </div>

    <div id="registerFormBox" class="form-box">
        <form action="/register" method="POST">
            <div class="form-group">
                <label>E-Posta Adresi</label>
                <input type="email" name="email" required placeholder="ornek@eposta.com">
            </div>
            <div class="form-group">
                <label>Şifre Oluştur</label>
                <input type="password" name="password" required placeholder="En az 6 karakter">
            </div>
            <button type="submit" class="submit-btn" style="background: #2ecc71;">Hesap Oluştur</button>
        </form>
    </div>
</div>

<script>
    function switchTab(type) {
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginBox = document.getElementById('loginFormBox');
        const registerBox = document.getElementById('registerFormBox');

        if (type === 'login') {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginBox.classList.add('active');
            registerBox.classList.remove('active');
        } else {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerBox.classList.add('active');
            loginBox.classList.remove('active');
        }
    }
</script>

</body>
</html>
